<head>

<title>Assistant MaqPro — Protocoles d'application</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F4;--surface:#FFFFFF;--border:#E5E2DC;--border-soft:#EEECE8;
  --text:#1A1A1A;--text-secondary:#6B6560;--text-tertiary:#A09890;
  --accent:#C0392B;--accent-soft:#FAEEEC;--accent-border:#E8B5B0;
  --green:#2D6A3F;--green-soft:#EBF4EE;--green-border:#A3CEAD;
  --radius:10px;--radius-sm:6px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
header{width:100%;max-width:800px;display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:38px;height:38px;background:#1A1A1A;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:600;color:#fff;letter-spacing:.5px}
.header-text h1{font-size:16px;font-weight:600;color:var(--text)}
.header-text p{font-size:12px;color:var(--text-secondary);margin-top:1px}
.badge{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--green-soft);color:var(--green);border:1px solid var(--green-border);white-space:nowrap}
#app{width:100%;max-width:800px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 140px);min-height:500px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:94%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}
.bub{padding:10px 14px;border-radius:11px;font-size:13px;line-height:1.65}
.msg.user .bub{background:#1A1A1A;color:#fff;border-radius:11px 11px 3px 11px}
.msg.bot .bub{background:#F7F6F4;color:var(--text);border:1px solid var(--border-soft);border-radius:11px 11px 11px 3px;width:100%}
.av{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.msg.bot .av{background:#1A1A1A;color:#fff}
.msg.user .av{background:#E8E5E0;color:var(--text-secondary);border:1px solid var(--border)}
.sl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text-tertiary);margin:8px 0 4px;display:block}
.sl:first-child{margin-top:0}
.step{display:block;padding:3px 0 3px 13px;border-left:2px solid var(--border);margin-bottom:3px;font-size:13px}
.note{display:flex;gap:7px;align-items:flex-start;margin-top:7px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--accent-border);background:var(--accent-soft)}
.note span{color:var(--accent);font-size:12px;line-height:1.5}
.note::before{content:"⚠";font-size:13px;flex-shrink:0;color:var(--accent)}
.meta{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap}
.mpill{font-size:11px;padding:2px 9px;border-radius:20px;background:#F0EDE8;border:1px solid var(--border);color:var(--text-secondary)}
.prod-block{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:4px}
.prod-row{padding:7px 11px;border-bottom:1px solid var(--border-soft);font-size:12px;line-height:1.5}
.prod-row:last-child{border-bottom:none}
.prod-row strong{color:var(--text)}
.prod-row span{color:var(--text-secondary)}
.demaq-block{padding:9px 11px;background:#F7F6F4;border-radius:var(--radius-sm);border:1px solid var(--border);font-size:12px;line-height:1.7;color:var(--text-secondary)}
.demaq-block strong{color:var(--text)}
.toggle-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;background:var(--surface);color:var(--text-secondary);margin-top:4px;margin-bottom:2px;transition:background .15s;font-family:'Inter',system-ui,sans-serif}
.toggle-btn:hover{background:#F0EDE8}
.refs-text{font-size:11.5px;color:var(--text-secondary);margin-bottom:7px}
.typing{display:flex;gap:4px;padding:10px 13px;background:#F7F6F4;border:1px solid var(--border-soft);border-radius:11px 11px 11px 3px;align-items:center}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--text-tertiary);animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
#chips-wrap{border-top:1px solid var(--border);flex-shrink:0}
#chips{padding:8px 12px 4px;display:flex;gap:5px;flex-wrap:wrap;max-height:110px;overflow-y:auto}
.chip{padding:4px 10px;border:1px solid var(--border);border-radius:20px;font-size:11.5px;cursor:pointer;background:var(--surface);color:var(--text-secondary);white-space:nowrap;transition:all .15s;font-family:'Inter',system-ui,sans-serif}
.chip:hover{background:#F0EDE8;border-color:#C8C3BB;color:var(--text)}
.chip:disabled{opacity:.4;cursor:default}
#input-row{display:flex;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--border-soft)}
#inp{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;resize:none;min-height:38px;max-height:80px;background:var(--surface);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.4}
#inp:focus{outline:none;border-color:#A09890}
#inp::placeholder{color:var(--text-tertiary)}
#send-btn{width:36px;height:36px;border-radius:var(--radius-sm);border:none;background:#1A1A1A;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
#send-btn:hover{opacity:.8}
#send-btn:disabled{opacity:.35;cursor:not-allowed}
footer{width:100%;max-width:800px;text-align:center;margin-top:12px;font-size:11px;color:var(--text-tertiary)}
</style>
</head>

{user:"Comment faire une brûlure chimique ?",meta:["⏱ 1 min 30s","Tenue effet : 3–5 min"],refs:"Protection Latex (2070) · Fard crème rouge (1003/A) · Simulation cloques (2150) · Comprimé effervescent · Vaporisateur d'eau",produits:["Protection Latex","Fards Crème","Produit Simulation Cloques","Dissolvant pour Colles et Latex","Biological Cleaner"],warning:"L'effet effervescent dure 3 à 5 minutes — déclencher au moment précis.",steps:["<strong>Protection Latex</strong>. <strong>Fard rouge</strong>.","Fine couche de <strong>Produit Simulation Cloques</strong> à la spatule.","<strong>Comprimé effervescent réduit en poudre</strong>. <strong>Vaporiser de l'eau</strong>."],demaq:[{s:"Démaquillage",d:"Kleenex → coton <strong>Dissolvant pour colles</strong> → coton <strong>Biological cleaner</strong>."}]},

let n=0,busy=false,history=[];
const chat=document.getElementById('chat');

function addUser(t){const d=document.createElement('div');d.className='msg user';const av=document.createElement('div');av.className='av';av.textContent='Vous';const b=document.createElement('div');b.className='bub';b.textContent=t;d.appendChild(av);d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function addBot(h){const d=document.createElement('div');d.className='msg bot';const av=document.createElement('div');av.className='av';av.textContent='MQ';const b=document.createElement('div');b.className='bub';b.innerHTML=h;d.appendChild(av);d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function showTyping(){const d=document.createElement('div');d.className='msg bot';d.id='typ';const av=document.createElement('div');av.className='av';av.textContent='MQ';const t=document.createElement('div');t.className='typing';t.innerHTML='<span></span><span></span><span></span>';d.appendChild(av);d.appendChild(t);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}

function toggleProds(id){
  const bl=document.getElementById('pb-'+id),bt=document.getElementById('bt-'+id);
  if(!bl)return;const v=bl.style.display!=='none';
  bl.style.display=v?'none':'block';
  bt.textContent=v?'▸ Voir les spécificités produits':'▾ Masquer les spécificités';
}

function build(sc,id){
  let h='';
  h+=`<div class="meta">`;for(const m of sc.meta)h+=`<span class="mpill">${m}</span>`;h+=`</div>`;
  h+=`<span class="sl">Références produits</span><div class="refs-text">${sc.refs}</div>`;
  if(sc.warning)h+=`<div class="note"><span>${sc.warning}</span></div>`;
  if(sc.produits&&sc.produits.length){
    h+=`<button class="toggle-btn" id="bt-${id}" onclick="toggleProds('${id}')">▸ Voir les spécificités produits</button>`;
    h+=`<div id="pb-${id}" style="display:none"><span class="sl">Spécificités des produits</span><div class="prod-block">`;
    for(const p of sc.produits){const desc=PRODS[p]||'';if(desc)h+=`<div class="prod-row"><strong>${p}</strong><br><span>${desc}</span></div>`;}
    h+=`</div></div>`;
  }
  h+=`<span class="sl">Protocole étape par étape</span>`;
  for(let i=0;i<sc.steps.length;i++)h+=`<span class="step"><span style="font-size:10px;font-weight:600;color:#A09890;margin-right:5px">${i+1}.</span>${sc.steps[i]}</span>`;
  if(sc.demaq&&sc.demaq.length){h+=`<span class="sl">Démaquillage</span><div class="demaq-block">`;for(const d of sc.demaq)h+=`<div style="margin-bottom:5px"><strong>${d.s} —</strong> ${d.d}</div>`;h+=`</div>`;}
  return h;
}

function run(idx){
  if(busy)return;
  document.querySelectorAll('.chip').forEach(c=>c.disabled=true);
  const sc=S[idx];addUser(sc.user);history.push({role:'user',content:sc.user});
  setTimeout(()=>{showTyping();setTimeout(()=>{document.getElementById('typ')?.remove();n++;addBot(build(sc,n));history.push({role:'assistant',content:'[protocole affiché]'});document.querySelectorAll('.chip').forEach(c=>c.disabled=false);},800);},200);
}

async function sendFree(){
  const inp=document.getElementById('inp');
  const txt=inp.value.trim();
  if(!txt||busy)return;
  inp.value='';inp.style.height='auto';setBusy(true);
  addUser(txt);history.push({role:'user',content:txt});showTyping();
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYSTEM,messages:history})
    });
    const data=await resp.json();
    const reply=data.content&&data.content[0]&&data.content[0].text?data.content[0].text:'Désolé, je n\'ai pas pu générer de réponse.';
    document.getElementById('typ')?.remove();
    addBot(reply.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>'));
    history.push({role:'assistant',content:reply});
  }catch(e){
    document.getElementById('typ')?.remove();
    addBot('Une erreur est survenue. Vérifiez votre connexion.');
  }
  setBusy(false);
}

function setBusy(b){busy=b;document.getElementById('send-btn').disabled=b;document.querySelectorAll('.chip').forEach(c=>c.disabled=b);}
const inp=document.getElementById('inp');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,80)+'px';});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFree();}});
addBot('Bonjour ! Je suis votre assistant MaqPro spécialisé dans la réalisation de maquillage effets spéciaux et secourisme.<br><br>Je peux vous guider sur les <strong>protocoles d\'application</strong> et les <strong>précautions d\'emploi</strong> et vous aider à choisir les bons produits pour un effet précis.<br><br>Utilisez les raccourcis ci-dessous ou posez directement votre question.');
</script>
